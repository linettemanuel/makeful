function render(lang){
 const d=DATA[lang]; document.documentElement.lang=lang; document.title=d.title; document.getElementById('lang-label').textContent=lang==='en'?'EN':'CZ';
 document.querySelectorAll('.nav-links a').forEach((a,i)=>a.textContent=d.nav[i]); document.querySelector('.nav-cta').textContent=d.cta; document.querySelector('.nav-cta').href=lang==='en'?'/registrace?language=en':'/registrace';
 document.getElementById('kicker').textContent=d.kicker; document.getElementById('hero').innerHTML=d.hero; document.getElementById('lead').innerHTML=d.lead;
 document.getElementById('meta').innerHTML=d.meta.map(r=>`<div class="meta-row"><div class="meta-key">${r[0]}</div><div class="meta-val">${r[1]}</div></div>`).join('');
 document.getElementById('toc-title').textContent=d.toc; document.getElementById('toc').innerHTML=d.sections.map((s,i)=>`<a class="toc-link" href="#${s[0]}"><span class="toc-num">${i+1}</span><span>${s[1]}</span></a>`).join('');
 document.getElementById('content').innerHTML=d.sections.map((s,i)=>`<section class="terms-section" id="${s[0]}"><div class="section-head"><div class="section-num">${i+1}</div><h2>${s[1]}</h2></div>${s[2]}</section>`).join('');
 document.getElementById('contact-title').textContent=d.contactTitle; document.getElementById('contact-text').innerHTML=d.contactText; document.getElementById('contact-cta').textContent=d.contactCta;
 document.querySelectorAll('.footlinks a').forEach((a,i)=>a.textContent=d.footer[i]); document.getElementById('copy').textContent=d.copy;
 const url=new URL(window.location); if(lang==='en')url.searchParams.set('language','en'); else url.searchParams.delete('language'); history.replaceState({},'',url); setupToc();
}
function toggleLang(){render(document.documentElement.lang==='en'?'cs':'en')}
function toggleMenu(){document.body.classList.toggle('nav-open')}
function setupToc(){const links=[...document.querySelectorAll('.toc-link')]; const sections=links.map(l=>[l,document.querySelector(l.getAttribute('href'))]); function onScroll(){let active=sections[0]; const y=scrollY+130; sections.forEach(s=>{if(s[1]&&s[1].offsetTop<=y)active=s}); links.forEach(l=>l.classList.remove('active')); if(active)active[0].classList.add('active')} window.onscroll=onScroll; onScroll();}
document.addEventListener('click',e=>{if(document.body.classList.contains('nav-open')&&!document.querySelector('.nav').contains(e.target))document.body.classList.remove('nav-open');});
render(new URLSearchParams(location.search).get('language')==='en'?'en':'cs');
</script></body></html>
