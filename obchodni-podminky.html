<script>
const DATA={"cs": {"title": "Všeobecné obchodní podmínky – Makeful", "nav": ["Program", "Termíny", "FAQ", "Kontakt"], "cta": "Přihlásit se", "kicker": "Právní dokumenty", "hero": "Všeobecné<br>obchodní podmínky", "lead": "Tyto podmínky upravují účast v programu <strong>Makeful – Letní módní kreativní laboratoř</strong>. Jsou napsány srozumitelně a férově. Pokud potřebujete cokoli upřesnit, stačí se ozvat.", "meta": [["Platné od", "1. 1. 2026"], ["Vztahuje se na", "Makeful – Letní módní kreativní laboratoř"], ["Poskytovatel", "Linette Leandra Cabral Manuel, IČO: 08487341"], ["Kontakt", "<a href='tel:+420735820576'>+420 735 820 576</a> · <a href='mailto:hello@make-ful.com'>hello@make-ful.com</a>"]], "toc": "Obsah", "sections": [["uvod", "Úvodní ustanovení", "\n<p>Tyto všeobecné obchodní podmínky (dále jen „VOP“) upravují práva a povinnosti smluvních stran při poskytování vzdělávacích a kreativních programů pod označením <strong>Makeful – Letní módní kreativní laboratoř</strong> (dále jen „program“ nebo „kemp“).</p>\n<p>Poskytovatelem programu je <strong>Linette Leandra Cabral Manuel</strong>, fyzická osoba podnikající na základě živnostenského oprávnění, se sídlem Roháčova 145/14, 130 00 Praha 3, IČO: 08487341, tel.: 735 820 576, e-mail: hello@make-ful.com (dále jen „poskytovatel“).</p>\n<p>Zákazníkem (dále jen „objednatel“) je zákonný zástupce nezletilého účastníka nebo zletilý účastník, který uzavírá smlouvu o účasti v programu. Účastníkem je mladá osoba ve věku 10–19 let, která se programu fyzicky účastní. <strong>Program je primárně koncipován jako inspirativní a bezpečné prostředí pro dívky; v případě vážného zájmu chlapců o módní design, AI a 3D tisk je jejich účast možná po předchozí individuální domluvě a posouzení vhodnosti s poskytovatelem.</strong></p>\n<div class=\"callout\"><p>Odesláním přihlášky a úhradou zálohy objednatel potvrzuje, že se seznámil s těmito VOP a souhlasí s nimi.</p></div>\n"], ["prihlaska", "Přihláška a uzavření smlouvy", "\n<p>Smlouva o účasti je uzavřena okamžikem, kdy poskytovatel potvrdí přihlášku e-mailem a objednatel uhradí zálohu ve výši 1 500 Kč. Přihlášku lze podat výhradně elektronicky prostřednictvím přihlašovacího formuláře na webových stránkách poskytovatele.</p>\n<p>Poskytovatel si vyhrazuje právo přihlášku odmítnout, zejména je-li kapacita turnusu naplněna nebo nesplňuje-li účastník věkové podmínky programu.</p>\n<div class=\"callout\"><p>Každý turnus má <strong>maximální kapacitu 10 účastníků</strong> a minimální kapacitu 5 účastníků. Místa jsou přidělována v pořadí přijetí zálohy.</p></div>\n"], ["cena", "Cena a platební podmínky", "\n<p>Cena programu za jeden turnus (7 dní) se odvíjí od konkrétní věkové skupiny účastníka takto:</p>\n<ul><li><strong>Věková skupina 10–12 let:</strong> 7 888 Kč</li><li><strong>Věková skupina 13–15 let:</strong> 8 888 Kč</li><li><strong>Věková skupina 16–19 let:</strong> 9 888 Kč</li></ul>\n<p>Uvedené ceny platí, není-li v době odeslání přihlášky na webových stránkách aktivní jiná akční nabídka či specifická sleva.</p>\n<h3>Záloha</h3><p>Záloha ve výši <strong>1 500 Kč</strong> je splatná do 5 pracovních dní od odeslání přihlášky a závazně rezervuje místo na zvoleném turnusu.</p>\n<h3>Doplatek</h3><p>Doplatek ve výši rozdílu celkové ceny a zálohy je splatný nejpozději <strong>14 kalendářních dní před zahájením</strong> zvoleného turnusu. Na žádost objednatele lze doplatek rozdělit na dvě části, přičemž druhá část musí být uhrazena nejpozději 14 dní před zahájením.</p>\n<div class=\"callout dark\"><p>Neuhradí-li objednatel doplatek ve stanoveném termínu, vyhrazuje si poskytovatel právo <strong>místo uvolnit bez nároku na vrácení zálohy</strong>.</p></div>\n<h3>Způsoby platby</h3><ul><li>Bankovní převod</li><li>Platební karta</li><li>Benefit Plus</li><li>Pluxee</li><li>Up Benefity</li><li>Edenred</li></ul>\n"], ["slevy", "Slevové podmínky", "\n<p>Poskytovatel může v rámci programu nabízet různé druhy slev (věrnostní, partnerské, sponzorské, slevové kódy) dle aktuální nabídky zveřejněné na webových stránkách nebo sdělené individuálně.</p>\n<div class=\"callout dark\"><p><strong>Slevy nelze vzájemně kombinovat.</strong> Pokud má objednatel nárok na více slev současně, uplatní se automaticky ta s nejvyšší hodnotou.</p></div>\n<p>Nárok na slevu je třeba uplatnit nejpozději při podání přihlášky. Slevu nelze uplatnit zpětně po uzavření smlouvy. Poskytovatel si vyhrazuje právo slevové podmínky měnit nebo ukončit bez předchozího upozornění; změna nemá vliv na přihlášky, u nichž byl již potvrzen nárok na slevu.</p>\n"], ["storno", "Storno a přesun termínu", "\n<h3>Storno přihlášky ze strany objednatele</h3>\n<ul><li><strong>Více než 30 dní před zahájením:</strong> záloha 1 500 Kč se nevrací; doplatek (byl-li uhrazen) bude vrácen v plné výši.</li><li><strong>15–30 dní před zahájením:</strong> vrací se 50 % z celkové ceny.</li><li><strong>Méně než 15 dní před zahájením nebo po zahájení:</strong> žádná platba se nevrací.</li></ul>\n<h3>Přesun na jiný turnus</h3><p>Objednatel může požádat o přesun na jiný dostupný turnus nejpozději <strong>14 dní před zahájením</strong> původního turnusu. Přesun je možný jednou bezplatně; každý další přesun podléhá administrativnímu poplatku 500 Kč.</p>\n<h3>Způsob podání žádosti</h3><p>Žádost o storno nebo přesun musí být zaslána písemně na e-mail <a href=\"mailto:hello@make-ful.com\">hello@make-ful.com</a>. Za datum doručení se považuje den přijetí e-mailu poskytovatelem.</p>\n<div class=\"callout\"><p>V případě nemoci účastníka doložené lékařským potvrzením nejpozději do 3 dnů od zahájení turnusu si poskytovatel vyhrazuje právo nabídnout individuální řešení (přesun, kredit).</p></div>\n"], ["zruseni", "Zrušení nebo změna programu ze strany poskytovatele", "\n<p>Poskytovatel si vyhrazuje právo turnus zrušit, není-li naplněna minimální kapacita (5 účastníků) nebo nastane-li důvod vyšší moci (živelná pohroma, opatření orgánů veřejné moci apod.).</p>\n<p>V případě zrušení turnusu poskytovatelem bude objednateli vrácena celá uhrazená částka, nebo mu bude nabídnut náhradní termín.</p>\n<p>Poskytovatel si vyhrazuje právo provést změny v programu (lektoři, nástroje, pořadí projektů) bez náhrady, nezmění-li se tím podstatný charakter programu.</p>\n"], ["prubeh", "Průběh programu a povinnosti účastníka", "\n<p>Program probíhá v kreativní laboratoři na adrese <strong>Argentinská 1, Praha 7</strong>. Jedná se o 7denní formát (pondělí až neděle). Výuka probíhá od pondělí do soboty v čase <strong>9:00–17:00 hod</strong> a v neděli v čase <strong>9:00–12:00 hod</strong> (závěrečná slavnostní prezentace projektů a předávání diplomů).</p>\n<p>Přesné kalendářní rozpisy letních turnusů pro rok 2026 rozdělené dle věkových kategorií a komunikačního jazyka (CZ nebo EN) jsou uvedeny v oficiálním harmonogramu na webových stránkách poskytovatele.</p>\n<h3>Povinnosti účastníka</h3><ul><li>Dodržovat pokyny lektorů a respektovat bezpečnostní pravidla práce s technickým vybavením.</li><li>Chovat se ohleduplně vůči ostatním účastníkům a vybavení dílny.</li><li>Přijít v pohodlném oblečení vhodném k praktické tvůrčí práci.</li></ul>\n<h3>Stravování a pitný režim</h3><p>Kompletní stravování, které zahrnuje plnohodnotné teplé obědy, dopolední i odpolední svačiny a stálý pitný režim po celou dobu trvání programu, je zajištěno poskytovatelem a je zahrnuto v ceně kempu.</p>\n<h3>Notebook</h3><p>Vlastní notebook není povinný; v dílně jsou k dispozici počítače pro všechny účastníky.</p>\n<div class=\"callout dark\"><p>Poskytovatel si vyhrazuje právo vyloučit účastníka z programu <strong>bez nároku na vrácení ceny</strong> v případě hrubého porušení pravidel, poškozování majetku nebo nebezpečného chování.</p></div>\n"], ["obsah", "Obsah programu – co je zahrnuto v ceně", "\n<h3>V ceně je zahrnuto</h3>\n<ul><li>7denní program v plně vybavené kreativní laboratoři v Praze.</li><li>Každodenní intenzivní vedení lektorek a individuální přístup.</li><li>Všechny materiály k výrobě.</li><li>Tričko a boty, které si účastník vlastnoručně upraví a odnese domů.</li><li>Výroba 6 vlastních kreativních a technologických projektů.</li><li>Stravování – teplé obědy, svačiny a kompletní pitný režim každý den.</li><li>Přístup k exkluzivním online přednáškám od futuristických světových návrhářů.</li><li>Osobní webové portfolio, certifikát o absolvování a závěrečná prezentace.</li></ul>\n<h3>V ceně není zahrnuto</h3><ul><li>Doprava na místo konání a zpět.</li></ul>\n"], ["gdpr", "Ochrana osobních údajů", "\n<p>Poskytovatel zpracovává osobní údaje objednatele a účastníka v souladu s nařízením (EU) 2016/679 (GDPR) a zákonem č. 110/2019 Sb., o zpracování osobních údajů.</p>\n<p>Osobní údaje jsou zpracovávány za účelem plnění smlouvy, zajištění bezpečnosti účastníka a komunikace s objednatelem. Podrobné informace jsou obsaženy v <a href=\"/ochrana-osobnich-udaju\">Zásadách ochrany osobních údajů</a>.</p>\n<div class=\"callout\"><p>Objednatel souhlasí s tím, že fotografie a videa pořízené v průběhu programu mohou být poskytovatelem použity pro marketingové účely. Souhlas lze kdykoliv odvolat písemně na <a href=\"mailto:hello@make-ful.com\">hello@make-ful.com</a>.</p></div>\n"], ["ip", "Práva duševního vlastnictví", "\n<h3>Fyzické výrobky</h3><p>Veškeré fyzické výrobky vytvořené účastníkem jsou jeho vlastnictvím a odnáší si je po skončení programu domů.</p>\n<h3>Digitální díla účastníka</h3><p>Autorská práva k digitálním dílům náleží účastníkovi. Účastník nebo jeho zákonný zástupce uděluje poskytovateli bezplatnou licenci k jejich použití pro prezentaci programu, a to na dobu neurčitou a bez územního omezení. Licenci lze odvolat písemnou žádostí na <a href=\"mailto:hello@make-ful.com\">hello@make-ful.com</a>.</p>\n<h3>Materiály poskytovatele</h3><p>Výukové materiály, metodiky a software poskytnuté poskytovatelem jsou chráněny autorským právem a nesmí být bez jeho souhlasu kopírovány, sdíleny ani komerčně využívány.</p>\n"], ["odpovednost", "Odpovědnost za škodu a zdravotní způsobilost", "\n<p>Objednatel prohlašuje, že účastník je zdravotně způsobilý k účasti v programu a že poskytovatel byl informován o veškerých zdravotních omezeních, alergiích nebo speciálních potřebách účastníka.</p>\n<p>Poskytovatel odpovídá za škody způsobené účastníkovi prokazatelně v důsledku porušení svých povinností. Odpovědnost poskytovatele se nevztahuje na škody vzniklé nedodržením bezpečnostních pokynů nebo neuváženým chováním účastníka.</p>\n<p>Účastník nebo zákonný zástupce odpovídá za škody způsobené účastníkem na zařízení dílny nebo majetku třetích osob.</p>\n<div class=\"callout\"><p>Poskytovatel nenese odpovědnost za ztrátu nebo odcizení osobních věcí účastníka v prostorách dílny.</p></div>\n"], ["spory", "Mimosoudní řešení sporů a rozhodné právo", "\n<p>Smluvní strany se zavazují řešit případné spory přednostně dohodou. V případě, že nedojde k dohodě, má spotřebitel právo obrátit se na <strong>Českou obchodní inspekci</strong> (<a href=\"https://www.coi.cz\" target=\"_blank\" rel=\"noopener\">www.coi.cz</a>) jako subjekt mimosoudního řešení spotřebitelských sporů.</p>\n<p>Tyto VOP se řídí právním řádem České republiky, zejména zákonem č. 89/2012 Sb. a zákonem č. 634/1992 Sb.</p>\n<p>Veškeré spory, které se nepodaří vyřešit mimosoudně, budou rozhodovány věcně a místně příslušnými soudy České republiky.</p>\n"], ["zaver", "Závěrečná ustanovení", "\n<p>Poskytovatel si vyhrazuje právo tyto VOP jednostranně měnit. Změna bude oznámena e-mailem nejméně <strong>14 dní před nabytím účinnosti</strong>. Na přihlášky podané před oznámením změny se vztahují VOP platné v době uzavření smlouvy.</p>\n<p>Je-li nebo stane-li se některé ustanovení těchto VOP neplatným nebo nevymahatelným, nemá to vliv na platnost ostatních ustanovení.</p>\n<p>Tyto VOP jsou platné a účinné od <strong>1. 1. 2026</strong>.</p>\n"]], "contactTitle": "Dotaz k podmínkám?", "contactText": "Napište nám na <a href='mailto:hello@make-ful.com'>hello@make-ful.com</a> nebo zavolejte na <a href='tel:+420735820576'>+420 735 820 576</a>.", "contactCta": "Napsat přímo", "footer": ["Program", "Termíny", "FAQ", "Kontakt", "Ochrana osobních údajů"], "copy": "© 2026 Makeful – FashionTech STEAM Program. Všechna práva vyhrazena."}, "en": {"title": "Terms and Conditions – Makeful", "nav": ["Program", "Dates", "FAQ", "Contact"], "cta": "Register", "kicker": "Legal documents", "hero": "General<br>Terms and Conditions", "lead": "These terms govern participation in the <strong>Makeful – Summer Creative FashionTech Laboratory</strong>. They are written to be clear and fair. If anything needs clarification, feel free to contact us.", "meta": [["Effective from", "1 January 2026"], ["Applies to", "Makeful – Summer Creative FashionTech Laboratory"], ["Provider", "Linette Leandra Cabral Manuel, Company ID: 08487341"], ["Contact", "<a href='tel:+420735820576'>+420 735 820 576</a> · <a href='mailto:hello@make-ful.com'>hello@make-ful.com</a>"]], "toc": "Contents", "sections": [["uvod", "Introductory provisions", "\n<p>These General Terms and Conditions (the “Terms”) govern the rights and obligations of the parties in connection with the provision of educational and creative programs under the name <strong>Makeful – Summer Creative FashionTech Laboratory</strong> (the “program” or “camp”).</p>\n<p>The provider of the program is <strong>Linette Leandra Cabral Manuel</strong>, a self-employed individual operating under a trade licence, with registered address at Roháčova 145/14, 130 00 Prague 3, Company ID: 08487341, phone: 735 820 576, e-mail: hello@make-ful.com (the “provider”).</p>\n<p>The customer is the legal guardian of a minor participant or an adult participant who enters into the agreement for participation in the program. The participant is a young person aged 10–19 who physically takes part in the program. <strong>The program is primarily designed as an inspiring and safe environment for girls; if boys have a genuine interest in fashion design, AI and 3D printing, their participation may be possible after prior individual consultation and assessment of suitability with the provider.</strong></p>\n<div class=\"callout\"><p>By submitting the application and paying the deposit, the customer confirms that they have read and agree to these Terms.</p></div>\n"], ["prihlaska", "Application and conclusion of the agreement", "\n<p>The agreement for participation is concluded when the provider confirms the application by e-mail and the customer pays the deposit of 1,500 CZK. The application may be submitted exclusively electronically via the application form on the provider’s website.</p>\n<p>The provider reserves the right to reject an application, especially if the session capacity is full or if the participant does not meet the age requirements of the program.</p>\n<div class=\"callout\"><p>Each session has a <strong>maximum capacity of 10 participants</strong> and a minimum capacity of 5 participants. Places are allocated in the order in which deposits are received.</p></div>\n"], ["cena", "Price and payment terms", "\n<p>The price of the program for one session (7 days) depends on the participant’s age group as follows:</p>\n<ul><li><strong>Age group 10–12:</strong> 7,888 CZK</li><li><strong>Age group 13–15:</strong> 8,888 CZK</li><li><strong>Age group 16–19:</strong> 9,888 CZK</li></ul>\n<p>The listed prices apply unless another promotional offer or specific discount is active on the website at the time the application is submitted.</p>\n<h3>Deposit</h3><p>The deposit of <strong>1,500 CZK</strong> is due within 5 business days of submitting the application and secures the place in the selected session.</p>\n<h3>Balance payment</h3><p>The balance, equal to the difference between the total price and the deposit, is due no later than <strong>14 calendar days before the start</strong> of the selected session. At the customer’s request, the balance may be split into two parts, with the second part paid no later than 14 days before the start.</p>\n<div class=\"callout dark\"><p>If the customer does not pay the balance by the deadline, the provider reserves the right to <strong>release the place without refunding the deposit</strong>.</p></div>\n<h3>Payment methods</h3><ul><li>Bank transfer</li><li>Payment card</li><li>Benefit Plus</li><li>Pluxee</li><li>Up Benefity</li><li>Edenred</li></ul>\n"], ["slevy", "Discount terms", "\n<p>The provider may offer different types of discounts within the program according to the current offer published on the website or communicated individually.</p>\n<div class=\"callout dark\"><p><strong>Discounts cannot be combined.</strong> If the customer is entitled to more than one discount at the same time, the discount with the highest value will automatically apply.</p></div>\n<p>The discount must be claimed no later than at the time of submitting the application. A discount cannot be applied retroactively after the agreement has been concluded. The provider reserves the right to change or end discount terms without prior notice; this does not affect applications for which the entitlement to a discount has already been confirmed.</p>\n"], ["storno", "Cancellation and transfer to another session", "\n<h3>Cancellation by the customer</h3>\n<ul><li><strong>More than 30 days before the start:</strong> the 1,500 CZK deposit is non-refundable; the balance payment, if already paid, will be refunded in full.</li><li><strong>15–30 days before the start:</strong> 50% of the total price will be refunded.</li><li><strong>Less than 15 days before the start or after the start:</strong> no payment will be refunded.</li></ul>\n<h3>Transfer to another session</h3><p>The customer may request a transfer to another available session no later than <strong>14 days before the start</strong> of the original session. One transfer is possible free of charge; each additional transfer is subject to an administrative fee of 500 CZK.</p>\n<h3>How to submit a request</h3><p>A cancellation or transfer request must be sent in writing to <a href=\"mailto:hello@make-ful.com\">hello@make-ful.com</a>. The date of delivery is the date on which the provider receives the e-mail.</p>\n<div class=\"callout\"><p>In the event of illness of the participant, proven by a medical certificate delivered no later than 3 days after the start of the session, the provider reserves the right to offer an individual solution.</p></div>\n"], ["zruseni", "Cancellation or change of the program by the provider", "\n<p>The provider reserves the right to cancel a session if the minimum capacity (5 participants) is not met or if a force majeure event occurs.</p>\n<p>If the provider cancels a session, the customer will be refunded the full amount paid or offered an alternative date.</p>\n<p>The provider reserves the right to make changes to the program without compensation, provided that the essential nature of the program does not change.</p>\n"], ["prubeh", "Program schedule and participant obligations", "\n<p>The program takes place in the creative lab at <strong>Argentinská 1, Prague 7</strong>. It is a 7-day format (Monday to Sunday). Teaching takes place Monday to Saturday from <strong>9:00–17:00</strong> and on Sunday from <strong>9:00–12:00</strong>.</p>\n<p>The exact 2026 summer session schedule, divided by age category and communication language, is listed in the official schedule on the provider’s website.</p>\n<h3>Participant obligations</h3><ul><li>Follow the mentors’ instructions and safety rules for working with technical equipment.</li><li>Behave considerately toward other participants and the workshop equipment.</li><li>Arrive in comfortable clothing suitable for practical creative work.</li></ul>\n<h3>Meals and drinks</h3><p>Complete catering, including warm lunches, snacks and drinks throughout the program, is fully provided by the provider and included in the camp price.</p>\n<h3>Laptop</h3><p>A personal laptop is not required; computers are available in the workshop for all participants.</p>\n<div class=\"callout dark\"><p>The provider reserves the right to exclude a participant from the program <strong>without refund</strong> in the event of a serious breach of rules, damage to property or dangerous behaviour.</p></div>\n"], ["obsah", "Program content – what is included in the price", "\n<h3>Included in the price</h3>\n<ul><li>7-day program in a fully equipped creative lab in Prague.</li><li>Daily intensive guidance from mentors and an individual approach.</li><li>All production materials.</li><li>A T-shirt and shoes that the participant customises and takes home.</li><li>Creation of 6 original creative and technological projects.</li><li>Catering – warm lunches, snacks and drinks every day.</li><li>Access to exclusive online talks by futuristic international designers.</li><li>Personal web portfolio, certificate of completion and final presentation.</li></ul>\n<h3>Not included in the price</h3><ul><li>Transport to and from the venue.</li></ul>\n"], ["gdpr", "Personal data protection", "\n<p>The provider processes the personal data of the customer and participant in accordance with Regulation (EU) 2016/679 (GDPR) and Czech Act No. 110/2019 Coll.</p>\n<p>Personal data is processed for the purpose of fulfilling the agreement, ensuring the participant’s safety and communicating with the customer. Detailed information is provided in the <a href=\"/ochrana-osobnich-udaju\">Privacy Policy</a>.</p>\n<div class=\"callout\"><p>The customer agrees that photographs and videos taken during the program may be used by the provider for marketing purposes. Consent may be withdrawn at any time in writing at <a href=\"mailto:hello@make-ful.com\">hello@make-ful.com</a>.</p></div>\n"], ["ip", "Intellectual property rights", "\n<h3>Physical products</h3><p>All physical products created by the participant are their property and are taken home after the program ends.</p>\n<h3>Participant’s digital works</h3><p>Copyright to digital works belongs to the participant. The participant or legal guardian grants the provider a free licence to use these works for presentation of the program, for an unlimited period and without territorial limitation. The licence may be withdrawn by written request sent to <a href=\"mailto:hello@make-ful.com\">hello@make-ful.com</a>.</p>\n<h3>Provider’s materials</h3><p>Teaching materials, methodologies and software provided by the provider are protected by copyright and may not be copied, shared or commercially used without the provider’s consent.</p>\n"], ["odpovednost", "Liability for damage and health fitness", "\n<p>The customer declares that the participant is medically fit to participate in the program and that the provider has been informed of all health limitations, allergies or special needs of the participant.</p>\n<p>The provider is liable for damage caused to the participant demonstrably as a result of breach of the provider’s obligations. The provider’s liability does not apply to damage caused by failure to follow safety instructions or by reckless behaviour.</p>\n<p>The participant or legal guardian is liable for damage caused by the participant to the workshop equipment or to the property of third parties.</p>\n<div class=\"callout\"><p>The provider is not liable for loss or theft of the participant’s personal belongings on the workshop premises.</p></div>\n"], ["spory", "Out-of-court dispute resolution and governing law", "\n<p>The parties undertake to resolve any disputes primarily by agreement. If no agreement is reached, the consumer has the right to contact the <strong>Czech Trade Inspection Authority</strong> (<a href=\"https://www.coi.cz\" target=\"_blank\" rel=\"noopener\">www.coi.cz</a>) as the body for out-of-court consumer dispute resolution.</p>\n<p>These Terms are governed by the laws of the Czech Republic, in particular Act No. 89/2012 Coll. and Act No. 634/1992 Coll.</p>\n<p>Any disputes that cannot be resolved out of court will be decided by the competent courts of the Czech Republic.</p>\n"], ["zaver", "Final provisions", "\n<p>The provider reserves the right to amend these Terms unilaterally. The change will be announced by e-mail at least <strong>14 days before it becomes effective</strong>. Applications submitted before the announcement of the change are governed by the Terms valid at the time the agreement was concluded.</p>\n<p>If any provision of these Terms is or becomes invalid or unenforceable, this does not affect the validity of the remaining provisions.</p>\n<p>These Terms are valid and effective from <strong>1 January 2026</strong>.</p>\n"]], "contactTitle": "Question about the terms?", "contactText": "Email us at <a href='mailto:hello@make-ful.com'>hello@make-ful.com</a> or call <a href='tel:+420735820576'>+420 735 820 576</a>.", "contactCta": "Contact us", "footer": ["Program", "Dates", "FAQ", "Contact", "Privacy Policy"], "copy": "© 2026 Makeful – FashionTech STEAM Program. All rights reserved."}};

 const d=DATA[lang]; document.documentElement.lang=lang; document.title=d.title; document.getElementById('lang-label').textContent=lang==='en'?'EN':'CZ';

 const url=new URL(window.location); if(lang==='en')url.searchParams.set('language','en'); else url.searchParams.delete('language'); history.replaceState({},'',url); setupToc();
}
